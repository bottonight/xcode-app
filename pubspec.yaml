name: fabriclab
description: FabricLab cross-platform NIR and IR2210 analysis app.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_blue_plus: 1.36.8
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  http: ^1.4.0
  image_picker: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
